<div class="cart-item">
  <div class="item-image-wrapper">
    <img [src]="getImageUrl()" [alt]="item.productName" class="item-image" />
  </div>

  <div class="item-details">
    <h6 class="item-name">{{ item.productName }}</h6>
    <p class="item-desc">{{ item.productDescription }}</p>
    <div class="item-price">₹{{ item.price | number:'1.2-2' }}</div>

    <div class="item-actions">
      <div class="qty-control">
        <button class="qty-btn" (click)="decrement()" [disabled]="item.quantity <= 1">
          <i class="bi bi-dash"></i>
        </button>
        <span class="qty-value">{{ item.quantity }}</span>
        <button class="qty-btn" (click)="increment()">
          <i class="bi bi-plus"></i>
        </button>
      </div>

      <button class="remove-btn" (click)="remove()">
        <i class="bi bi-trash3"></i> Remove
      </button>
    </div>
  </div>

  <div class="item-subtotal">
    <span class="subtotal-label">Subtotal</span>
    <span class="subtotal-amount">₹{{ item.subTotal | number:'1.2-2' }}</span>
  </div>
</div>
